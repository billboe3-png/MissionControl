networks:
  mc-net:
    driver: bridge

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    expose:
      - "8000"

    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock

    working_dir: /app

    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      MISSIONCONTROL_SECRET_KEY: ${MISSIONCONTROL_SECRET_KEY:?MISSIONCONTROL_SECRET_KEY is required. Add it to your .env file.}

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - mc-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    expose:
      - "3000"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - mc-net

  nginx:
    image: nginx:1.27-alpine

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:80/"
        ]
      interval: 10s
      timeout: 5s
      retries: 3

    networks:
      - mc-net

  postgres:
    image: postgres:16-alpine

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    expose:
      - "5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - mc-net

  redis:
    image: redis:7.2-alpine

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    expose:
      - "6379"

    healthcheck:
      test:
        ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - mc-net

volumes:
  postgres_data:
  redis_data:
