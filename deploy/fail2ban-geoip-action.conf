[Definition]
# Custom action: ban only if source IP is not South Africa.
actionstart = <something>
actionstop = <something>
actioncheck = <something>
actionban = if [ -x /usr/bin/fail2ban-geoip-check.py ]; then GEOIP_RESULT=$(/usr/bin/fail2ban-geoip-check.py <ip>); else GEOIP_RESULT="ban"; fi; if [ "$GEOIP_RESULT" = "ban" ]; then <iptables-multiport-tcp>; else echo "Not banning <ip>: geo=$GEOIP_RESULT"; fi
actionunban = <iptables-multiport-tcp>
