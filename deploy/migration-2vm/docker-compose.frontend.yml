# Mission Control — Frontend VM stack (Phase 3 deployment artefact)
#
# Host: frontend VM 10.0.0.26 / 84.12.77.251
# Role: public TLS termination, reverse proxy, SPA
#
# Deliberate differences from the source-host compose file:
#   - only two services (no backend/postgres/redis/dockhand)
#   - port 3000 is NOT published (it is dead today and unnecessary exposure)
#   - no docker.sock anywhere on this host
#   - log rotation enabled
#
name: mc-fe

services:
  frontend:
    image: missioncontrol-frontend:${IMAGE_TAG:-601a878-20261020}
    container_name: mc-frontend
    restart: unless-stopped
    expose:
      - "3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: mc-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/letsencrypt:/var/www/letsencrypt:ro
    healthcheck:
      # Exercises the backend through the edge: the source host's static /health
      # check cannot detect an API outage.
      test:
        - CMD-SHELL
        - "wget -q --spider --no-check-certificate https://127.0.0.1/api/v1/health/live || exit 1"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
