# Mission Control — target edge nginx config (frontend VM, Phase 3 deployment artefact)
#
# Derived from the live source-host config (preserved snapshot: commit 75a8280,
# sha256 734f40e4...) with four approved changes:
#
#   1. /api/ proxies to the backend VM over the private VCN path
#      (http://10.0.0.33:8000) instead of a same-host compose service.
#   2. The public /dockhand/ route is removed (D-B/U5: Dockhand is not migrated
#      and no replacement UI is installed). The regex form also covers
#      /dockhand/api/* so the API surface cannot be reached by path variation.
#   3. /api/docs and /api/openapi.json are blocked publicly (U3) while all other
#      API routes keep working.
#   4. An ACME webroot location is added BEFORE the port-80 redirect so
#      certificate renewal no longer has to stop the container (the source host's
#      standalone authenticator is broken and stops nginx).
#
# Behaviour deliberately preserved: TLS protocols/ciphers, security headers,
# websocket upgrade headers, 3600s timeouts, 10m body size, proxying semantics.

server {
    listen 80;
    server_name _;

    # ACME http-01 challenge. MUST come before the blanket redirect.
    # The webroot is a host directory mounted read-only into this container;
    # certbot writes to it from the host, which is visible here.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/missioncontrol.optichosting.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/missioncontrol.optichosting.co.za/privkey.pem;
    ssl_protocols TLSv1.2;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 10m;

    # ---- U3: interactive API documentation is not public ----
    # Exact-match locations win over the /api/ prefix location, so these two
    # paths are blocked while every other /api/ route is unaffected.
    location = /api/docs {
        return 404;
    }
    location = /api/openapi.json {
        return 404;
    }
    # Defensive: FastAPI also serves the swagger UI assets and a redoc page.
    location = /api/redoc {
        return 404;
    }

    # ---- Mission Control API (backend VM over the private path) ----
    location /api/ {
        proxy_pass http://10.0.0.33:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    # ---- D-B / U5: no public Docker management UI ----
    # Matches /dockhand, /dockhand/ and /dockhand/<anything>, including
    # /dockhand/api/containers. No Dockhand container runs on this host.
    location ~ ^/dockhand(/|$) {
        return 404;
    }

    # ---- Mission Control frontend (SPA) ----
    location / {
        proxy_pass http://frontend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    # Edge health check (kept: harmless, and used by external monitors)
    location = /health {
        return 200 "ok";
    }
}
