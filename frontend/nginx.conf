server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Mission Control API (backend VM over the private path) ----
    # Mirrors the canonical /api/ block of the edge artefact
    # (/opt/missioncontrol/nginx/default.conf, HTTPS server block).
    # location "/api/" + proxy_pass ".../api/" keeps the /api/ prefix, so
    # /api/v1/health/live -> http://10.0.0.33:8000/api/v1/health/live
    location /api/ {
        proxy_pass http://10.0.0.33:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    # ---- API documentation is not public (parity with the edge) ----
    location = /api/docs { return 404; }
    location = /api/openapi.json { return 404; }
    location = /api/redoc { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
