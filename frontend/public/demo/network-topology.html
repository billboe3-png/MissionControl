<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Network Topology Demo</title>
<style>
  body { margin: 0; background: #0b0f17; color: #e5e7eb; font-family: ui-sans-serif, system-ui, sans-serif; }
  html, body { height: 100%; }
  .bar { display: flex; gap: 8px; padding: 12px; background: #0f172a; border-bottom: 1px solid #1f2937; align-items: center; flex-wrap: wrap; box-sizing: border-box; }
  .bar select { background: #111827; color: #e5e7eb; border: 1px solid #374151; padding: 8px 10px; border-radius: 6px; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px; background: #0b0f17; border: 1px solid #1f2937; border-radius: 999px; font-size: 12px; color: #cbd5e1; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
  .panes { display: grid; grid-template-columns: 1fr 320px; gap: 12px; padding: 12px; height: calc(100vh - 52px); box-sizing: border-box; }
  .graph { background: #0b0f17; border: 1px solid #1f2937; border-radius: 8px; overflow: hidden; position: relative; width: 100%; height: 100%; min-height: 200px; }
  .graph canvas, .graph svg { display: block; width: 100%; height: 100%; }
  .side { background: #0f172a; border: 1px solid #1f2937; border-radius: 8px; padding: 12px; overflow: auto; }
  .side h3 { margin: 4px 0 8px; color: #f3f4f6; }
  .item { border: 1px solid #1f2937; border-radius: 6px; padding: 8px; margin-bottom: 6px; background: #0b0f17; cursor: pointer; }
  .item.active { border-color: #22d3ee; background: #0f172a; }
  .item .name { color: #f3f4f6; font-size: 13px; }
  .item .meta { color: #9ca3af; font-size: 11px; }
  .detail { border-top: 1px solid #1f2937; margin-top: 8px; padding-top: 8px; }
  .detail table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .detail td:first-child { color: #9ca3af; padding: 3px 6px 3px 0; width: 40%; }
  .detail td:last-child { color: #e5e7eb; word-break: break-all; }
  .error { color: #f87171; padding: 10px; }
</style>
</head>
<body>
  <div class="bar">
    <select id="lib">
      <option value="cytoscape">Cytoscape</option>
      <option value="vis">Vis Network</option>
      <option value="d3">D3 Force</option>
    </select>
    <div class="legend" id="legend"></div>
  </div>
  <div class="panes">
    <div class="graph" id="graph">
      <div id="fallback" style="display:none; padding: 12px; color:#f87171;">Graph library failed to load.</div>
    </div>
    <div class="side">
      <h3>Devices</h3>
      <div id="devices"></div>
      <div id="detail" class="detail" style="display:none"></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vis-network@7.10.2/standalone/umd/vis-network.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vis-data@7.2.2/peer/umd/vis-data.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(function(){
  const COLORS = { switch: "#2563eb", server: "#16a34a", workstation: "#f59e0b", storage: "#7c3aed", unknown: "#6b7280" };
  const prefix = "192.168.10.";
  const switches = [];
  const devices = [];
  const addNode = function(arr, id, label, extra) {
    arr.push(Object.assign({ id: id, label: label }, extra || {}));
  };

  // core: 2
  addNode(switches, "s1", "core-sw01", { role: "core" });
  addNode(switches, "s2", "core-sw02", { role: "core" });
  // distribution: 8
  for (let i = 1; i <= 8; i++) addNode(switches, "d" + i, "dist-sw" + String(i).padStart(2, "0"), { role: "distribution" });
  // access: 10
  for (let i = 1; i <= 10; i++) addNode(switches, "a" + i, "access-sw" + String(i).padStart(2, "0"), { role: "access" });
  // servers
  addNode(devices, "srv1", "veeam-server", { ip: prefix + "10", mac: "aa:bb:cc:00:10:01", category: "server" });
  addNode(devices, "srv2", "hyperv-host01", { ip: prefix + "20", mac: "aa:bb:cc:00:20:01", category: "server" });
  addNode(devices, "srv3", "nas-storage01", { ip: prefix + "30", mac: "aa:bb:cc:00:30:01", category: "storage" });
  // 50 PCs
  for (let i = 1; i <= 50; i++) addNode(devices, "pc" + i, "pc-" + String(i).padStart(2, "0"), { ip: prefix + (100 + i), mac: "aa:bb:cc:" + [String(i).padStart(2,"0"), "00", "01"].join(":"), category: "workstation" });

  const edges = [];
  const link = function(source, target, port) {
    edges.push({ source: source, target: target, label: port || "" });
  };
  // core to core
  link("s1", "s2", "PortChannel1");
  // core to distribution
  for (let i = 1; i <= 8; i++) {
    const uplink = "PortChannel" + Math.ceil(i / 2);
    link("s1", "d" + i, uplink);
    link("s2", "d" + i, uplink);
  }
  // distribution to access
  for (let i = 1; i <= 8; i++) link("d" + i, "a" + i, "GigabitEthernet0/1");
  // access to PCs (about 5 per access switch)
  for (let i = 1; i <= 10; i++) {
    const base = (i - 1) * 5 + 1;
    for (let p = 0; p < 5; p++) {
      const pcId = "pc" + (base + p);
      if (pcId > "pc50") break;
      link(pcId, "a" + i, "GigabitEthernet1/" + String(p + 1).padStart(2, "0"));
    }
  }
  // servers to distribution
  link("srv1", "d1", "GigabitEthernet1/0/12");
  link("srv2", "d2", "GigabitEthernet1/0/24");
  link("srv3", "d3", "GigabitEthernet1/0/36");

  const topology = { discovered_at: new Date().toISOString(), switches: switches, devices: devices, edges: edges };

  function classifyById(id, label) {
    if (/^(core|dist|access|s\d|d\d|a\d)/.test(id)) return "switch";
    if (/^srv/.test(id)) return label && label.toLowerCase().includes("nas") ? "storage" : "server";
    if (/^pc/.test(id)) return "workstation";
    return "unknown";
  }

  function renderLegend() {
    const el = document.getElementById("legend");
    el.innerHTML = Object.entries(COLORS).map(function(entry) {
      const k = entry[0], v = entry[1];
      return '<div class="chip"><span class="dot" style="color:' + v + '"></span>' + k + '</div>';
    }).join("");
  }

  function renderDeviceList() {
    const all = topology.switches.concat(topology.devices);
    const el = document.getElementById("devices");
    el.innerHTML = all.map(function(item) {
      return '<div class="item" data-id="' + item.id + '"><div class="name">' + item.label + '</div><div class="meta">' + (item.ip || item.role || "") + '</div></div>';
    }).join("");
    el.querySelectorAll(".item").forEach(function(btn) {
      btn.addEventListener("click", function() {
        const id = btn.dataset.id;
        const item = all.find(function(x) { return x.id === id; });
        if (item) showDetail(item);
      });
    });
  }

  function showDetail(item) {
    const el = document.getElementById("detail");
    el.style.display = "block";
    const data = Object.assign({ id: item.id, label: item.label }, item);
    el.innerHTML = '<h3>' + item.label + '</h3><table>' + Object.keys(data).map(function(k) {
      return '<tr><td>' + k + '</td><td>' + String(data[k] ?? "") + '</td></tr>';
    }).join("") + '</table>';
  }

  function clearDetail() {
    const el = document.getElementById("detail");
    el.style.display = "none";
    el.innerHTML = "";
  }

  function ensureContainerSize() {
    const container = document.getElementById("graph");
    if (!container) return null;
    const w = container.clientWidth || 900;
    const h = container.clientHeight || 600;
    if (w < 10 || h < 10) {
      container.style.width = "100%";
      container.style.height = "100%";
      container.style.minHeight = "400px";
    }
    return container;
  }

  function tryResizeLater(lib, attempts) {
    if (attempts <= 0) return;
    setTimeout(function() {
      if (lib === "cytoscape" && window.__cy) window.__cy.resize();
      if (lib === "vis" && window.__vis) window.__vis.fit();
      tryResizeLater(lib, attempts - 1);
    }, 250);
  }

  function toCytoscapeElements() {
    const nodes = topology.switches.map(function(n) {
      return { data: { id: n.id, label: n.label, color: { background: COLORS.switch, border: "#111827" } } };
    });
    const devNodes = topology.devices.map(function(n) {
      const cat = classifyById(n.id, n.label);
      return { data: { id: n.id, label: n.label, color: { background: COLORS[cat] || COLORS.unknown, border: "#111827" } } };
    });
    const edgeElements = edges.map(function(e, idx) {
      return { data: { id: "e" + idx, source: e.source, target: e.target, label: e.label } };
    });
    return nodes.concat(devNodes).concat(edgeElements);
  }

  function renderCytoscape() {
    clearDetail();
    const container = ensureContainerSize();
    if (!container) return;
    container.innerHTML = '<div id="fallback" style="display:none; padding: 12px; color:#f87171;">Graph library failed to load.</div>';
    if (typeof Cytoscape === "undefined") { const fb = document.getElementById("fallback"); if (fb) fb.style.display = "block"; return; }
    window.__cy = Cytoscape({ container: container, elements: toCytoscapeElements(), layout: { name: "cose", animate: false, padding: 40 }, style: [
      { selector: "node", style: { label: "data(label)", "font-size": 11, "text-valign": "center", "text-halign": "center", width: 50, height: 50, "background-color": "data(color.background)", color: "#fff", "border-width": 2, "border-color": "data(color.border)" } },
      { selector: "edge", style: { label: "data(label)", "font-size": 9, "curve-style": "bezier", "target-arrow-shape": "triangle", "target-arrow-color": "#94a3b8", "line-color": "#94a3b8", width: 1.5, "text-rotation": "autorotate", "text-outline-color": "#ffffff", "text-outline-opacity": 0.6 } }
    ], minZoom: 0.2, maxZoom: 4 }).on("tap", "node", function(e) { showDetail(e.target.data()); });
    tryResizeLater("cytoscape", 6);
  }

  function renderVis() {
    clearDetail();
    const container = ensureContainerSize();
    if (!container) return;
    container.innerHTML = '<div id="fallback" style="display:none; padding: 12px; color:#f87171;">Graph library failed to load.</div>';
    const DataSet = window.DataSet || (window.visData && window.visData.DataSet);
    if (!DataSet || typeof Network === "undefined") { const fb = document.getElementById("fallback"); if (fb) fb.style.display = "block"; return; }
    const nodeSet = new Set();
    const nodeData = [];
    const addNodeIfMissing = function(item) {
      if (nodeSet.has(item.id)) return;
      nodeSet.add(item.id);
      const cat = classifyById(item.id, item.label);
      nodeData.push({ id: item.id, label: item.label, color: { background: COLORS[cat] || COLORS.unknown, border: "#111827" } });
    };
    topology.switches.forEach(addNodeIfMissing);
    topology.devices.forEach(addNodeIfMissing);
    const edgeData = edges.map(function(e, idx) { return { id: "e" + idx, from: e.source, to: e.target, label: e.label, arrows: "to", font: { align: "middle", size: 9 } }; });
    const data = { nodes: new DataSet(nodeData), edges: new DataSet(edgeData) };
    const visNet = new Network(container, data, { nodes: { shape: "dot", size: 16, font: { color: "#e5e7eb" }, borderWidth: 2, color: { border: "#111827", background: "#2563eb" } }, edges: { color: { color: "#94a3b8", highlight: "#22d3ee" }, arrows: { to: { enabled: true, scaleFactor: 0.6 } }, font: { color: "#e5e7eb", size: 9, strokeWidth: 3 }, smooth: { enabled: true, type: "cubicBezier", roundness: 0.1 } }, physics: { stabilization: true, barnesHut: { springLength: 80 } }, interaction: { hover: true } });
    window.__vis = visNet;
    visNet.on("click", function(params) { if (params.nodes.length) showDetail({ id: params.nodes[0], label: params.nodes[0] }); });
    tryResizeLater("vis", 6);
  }

  function renderD3() {
    clearDetail();
    const container = ensureContainerSize();
    if (!container) return;
    container.innerHTML = '<div id="fallback" style="display:none; padding: 12px; color:#f87171;">Graph library failed to load.</div>';
    if (typeof d3 === "undefined") { const fb = document.getElementById("fallback"); if (fb) fb.style.display = "block"; return; }
    const nodeMap = new Map();
    const nodes = [];
    topology.switches.forEach(function(n) { nodeMap.set(n.id, n.label); nodes.push({ id: n.id, label: n.label, category: "switch" }); });
    topology.devices.forEach(function(n) { nodeMap.set(n.id, n.label); nodes.push({ id: n.id, label: n.label, category: classifyById(n.id, n.label) }); });
    const nodeData = nodes.map(function(n) { return { id: n.id, label: n.label, color: { background: COLORS[n.category] || COLORS.unknown, border: "#111827" } }; });
    const edgeData = edges.map(function(e, idx) { return { id: "e" + idx, source: e.source, target: e.target, label: e.label }; });
    const w = container.clientWidth || 900, h = container.clientHeight || 600;
    const svg = d3.select(container).append("svg").attr("viewBox", [0, 0, w, h]).attr("width", "100%").attr("height", "100%");
    const g = svg.append("g");
    const zoom = d3.zoom().scaleExtent([0.2, 4]).on("zoom", function(event) { g.attr("transform", event.transform); });
    svg.call(zoom);
    const simulation = d3.forceSimulation(nodeData).force("link", d3.forceLink(edgeData).id(function(d) { return d.id; })).force("charge", d3.forceManyBody().strength(-250)).force("center", d3.forceCenter(w / 2, h / 2));
    const link = g.append("g").selectAll("line").data(edgeData).join("line").attr("stroke", "#475569").attr("stroke-width", 1.2);
    const label = g.append("g").selectAll("text").data(edgeData).join("text").text(function(d) { return d.label; }).attr("font-size", 8).attr("fill", "#e5e7eb").attr("text-anchor", "middle");
    const node = g.append("g").selectAll("circle").data(nodeData).join("circle").attr("r", 7).attr("fill", function(d) { return d.color && d.color.background ? d.color.background : "#2563eb"; }).attr("stroke", "#111827").attr("stroke-width", 1.5).on("click", function(_event, d) { showDetail({ id: d.id, label: d.label }); });
    simulation.on("tick", function() {
      link.attr("x1", function(d) { return d.source.x; }).attr("y1", function(d) { return d.source.y; }).attr("x2", function(d) { return d.target.x; }).attr("y2", function(d) { return d.target.y; });
      label.attr("x", function(d) { return (d.source.x + d.target.x) / 2; }).attr("y", function(d) { return (d.source.y + d.target.y) / 2; });
      node.attr("cx", function(d) { return d.x; }).attr("cy", function(d) { return d.y; });
    });
  }

  function render() {
    const lib = document.getElementById("lib").value;
    if (lib === "cytoscape") renderCytoscape();
    else if (lib === "vis") renderVis();
    else if (lib === "d3") renderD3();
  }

  function init() {
    renderLegend();
    renderDeviceList();
    render();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  window.addEventListener("resize", function() {
    if (window.__cy) window.__cy.resize();
    if (window.__vis) window.__vis.fit();
  });
})();
</script>
</body>
</html>
