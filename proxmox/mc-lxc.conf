# ============================================================================
# Mission Control LXC Container Configuration
#
# Used with: pct create <vmid> mission-control.tar.zst --configuration <this>
# Or paste individual settings into the Proxmox UI.
#
# Minimum Proxmox VE: 7.0
# Recommended: 8.0+
# ============================================================================

# --- System ---
arch: amd64
ostype: debian
hostname: mission-control
description: "Mission Control v3.0 — IT Operations Dashboard"

# --- Resources (adjust as needed) ---
cores: 2
memory: 4096
swap: 2048
balloon: 0

# --- Storage ---
# rootfs: local-lvm:8
# The 8GB rootfs is sufficient for the Docker images and MC data.
# For production, consider mounting a separate volume for /opt/mission-control/data.

# --- Network ---
# net0: name=eth0,bridge=vmbr0,hwaddr=auto,ip=dhcp,type=veth
# For static IP:
# net0: name=eth0,bridge=vmbr0,hwaddr=auto,ip=192.168.1.200/24,gw=192.168.1.1,type=veth

# --- DNS ---
# Set if your network requires specific DNS servers
# nameserver: 1.1.1.1,8.8.8.8

# --- Features ---
features: nesting=1,fuse=1
# nesting=1 is required for Docker-in-LXC

# --- Unprivileged ---
# Set to 0 only if you need full Docker capabilities
# unprivileged: 0

# --- Mount Points (for persistent data) ---
# For production, mount a separate volume for database persistence:
# mp0: local-lvm:10,mp=/opt/mission-control/data
