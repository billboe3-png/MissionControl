# ============================================================================
# Mission Control — Proxmox LXC Container Configuration Template
#
# Use this configuration when creating the LXC container on Proxmox.
# Apply with: pct set <VMID> <options>
#
# Or create via Proxmox UI with these settings.
# ============================================================================

# --- Container Settings ---
hostname: mission-control
ostype: ubuntu
arch: amd64
unprivileged: 1

# --- Resources ---
cores: 4
memory: 8192
swap: 0

# --- Storage ---
rootfs: local-lvm:80

# --- Network ---
net0: name=eth0,bridge=vmbr0,hwaddr=auto,ip=dhcp

# --- Features (REQUIRED for Docker) ---
features: nesting=1,keyctl=1

# --- Firewall (optional) ---
# firewall: 1

# --- Protection (enable after setup) ---
# protection: 1

# ============================================================================
# Proxmox CLI equivalents:
#
# pct create 200 local:vztmpl/ubuntu-24.04-standard_24.04.2-1_amd64.tar.zst \
#   --hostname mission-control \
#   --memory 8192 \
#   --cores 4 \
#   --rootfs local-lvm:80 \
#   --net0 name=eth0,bridge=vmbr0,hwaddr=auto,ip=dhcp
#
# pct set 200 -features nesting=1,keyctl=1
# ============================================================================
